<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">A session runs and its hooks fire</title>
<desc id="d">A terminal types out a Claude session. CLAUDE.md and 67 rules load, the user asks to tidy old notes, the agent tries a chained rm command, a hook blocks it, and the agent retries with trash. Beside it a board of hook events lights up in step, with pulses crossing from the terminal: SessionStart, UserPromptSubmit, PreToolUse in red then green, PostToolUse, and Stop.</desc>
