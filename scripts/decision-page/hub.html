<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision pages</title>
<style>
:root, :root[data-theme="dark"] {
  --bg: #101418; --surface: #1a2027; --surface-2: #232b34; --text: #e8edf2;
  --dim: #93a1af; --border: #2e3843; --accent: #5b9dd9; --ok: #4fc08d;
  --warn: #d9a05b; --rec: #2c4a63;
}
:root[data-theme="light"] {
  --bg: #f4f2ee; --surface: #ffffff; --surface-2: #f0ede8; --text: #22262a;
  --dim: #6b7580; --border: #ddd8d0; --accent: #2563a8; --ok: #1d7a4f;
  --warn: #9a6a1f; --rec: #dbe9f5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; background: var(--bg); z-index: 5;
  border-bottom: 1px solid var(--border); padding: 10px 22px;
  display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 16px; margin: 0; flex: 1; }
button { background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 7px; padding: 5px 11px;
  cursor: pointer; font-size: 12.5px; }
button:hover { border-color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 18px 22px 60px; }
.page { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px; margin: 12px 0;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.page.focused { outline: 2px solid var(--accent); outline-offset: 1px; }
.page .meta { flex: 1; min-width: 260px; }
.page a.title { color: var(--text); font-weight: 600; text-decoration: none; font-size: 15px; }
.page a.title:hover { color: var(--accent); }
.page .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.chip { font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
  border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.chip.untouched { background: var(--surface-2); color: var(--dim); }
.chip.clean { background: var(--rec); color: var(--accent); }
.chip.flips { background: var(--warn); color: #1c1408; }
.chip.broken { background: #a33; color: #fff; }
.note { color: var(--dim); font-size: 13px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 8px;
  opacity: 0; transition: opacity .25s; pointer-events: none; font-size: 14px; }
#toast.on { opacity: 1; }
kbd { background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 5px; font: 11.5px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>Decision pages</h1>
  <span class="note" id="count"></span>
  <button id="theme">☀ / ☾</button>
</header>
<main id="main"><p class="note">Loading…</p></main>
<div id="toast">Copied — paste it in chat</div>
<script>
/* Registry hub. Reads ./pages.json (regenerated by decision-page.sh on every
   mutating op) + each page's config.json + its localStorage state (same origin,
   so the human's in-browser answers are readable here) — shows live progress
   and can copy a page's answer string without opening it. */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PAGES = [], FOCUS = -1;

const ago = ts => { const s = (Date.now()/1000 - ts) | 0;
  for (const [d, u] of [[86400, "d"], [3600, "h"], [60, "m"]])
    if (s >= d) return `${(s/d)|0}${u} ago`;
  return "just now"; };

const stateOf = p => {
  try { return JSON.parse(localStorage.getItem("decision-page:" + (p.storageKey || "default")) || "null"); }
  catch { return null; } };

/* mirror of the page template's flips()/answerString() — over a fetched config */
function flipsOf(cfg, st) {
  const out = [];
  (cfg.decisions || []).forEach(d => {
    const rec = (d.options.find(o => o.rec) || {}).code;
    const cur = st?.d?.[d.id] ?? rec;
    if (cur !== rec) out.push(d.id);
  });
  Object.entries(st?.screens || {}).forEach(([k, v]) => { if (!v.agree || v.note) out.push(k); });
  return out;
}
function answerStringOf(cfg, st) {
  const lines = [(cfg.copyHeader || cfg.title || "answers") + ":"];
  if ((cfg.decisions || []).length)
    lines.push(cfg.decisions.map(d => {
      const rec = (d.options.find(o => o.rec) || {}).code;
      return d.id + (st?.d?.[d.id] ?? rec ?? "?");
    }).join(" "));
  Object.entries(st?.screens || {}).forEach(([k, v]) => {
    if (!v.agree || v.note) lines.push(
      `${k}: ${v.agree ? "agree" : "DISAGREE"}${v.note ? " — " + v.note : ""}`);
  });
  if (!lines.some((l, i) => i > 1)) lines.push("all items: agree as drafted");
  return lines.join("\n");
}

async function render() {
  let man;
  try { man = await (await fetch("pages.json", { cache: "no-store" })).json(); }
  catch { $("#main").innerHTML = `<p class="note">No pages.json — run:
    <kbd>decision-page.sh serve</kbd></p>`; return; }
  PAGES = man.pages || [];
  $("#count").textContent = PAGES.length ? `${PAGES.length} page(s)` : "";
  if (!PAGES.length) {
    $("#main").innerHTML = `<p class="note">No pages yet. Scaffold one:
      <kbd>decision-page.sh new &lt;slug&gt;</kbd></p>`; return;
  }
  const cards = await Promise.all(PAGES.map(async p => {
    let cfg = null;
    try { cfg = await (await fetch(`${p.slug}/config.json`, { cache: "no-store" })).json(); } catch {}
    const st = cfg ? stateOf(cfg) : null;
    const f = cfg ? flipsOf(cfg, st) : [];
    let chip = `<span class="chip untouched">untouched</span>`;
    if (p.broken || !cfg) chip = `<span class="chip broken">broken config</span>`;
    else if (f.length) chip = `<span class="chip flips">${f.length} flipped</span>`;
    else if (st) chip = `<span class="chip clean">viewed · as drafted</span>`;
    const touched = st?.ts ? ` · touched ${ago(st.ts / 1000)}` : "";
    return `<div class="page" data-slug="${esc(p.slug)}">
      <div class="meta">
        <a class="title" href="${esc(p.slug)}/">${esc(p.title)}</a>
        <div class="sub">${esc(p.slug)} · ${p.decisions}d + ${p.sections}s ·
          created ${ago(p.mtime)}${touched}</div>
      </div>
      ${chip}
      <button class="copy" data-slug="${esc(p.slug)}">copy answers</button>
    </div>`;
  }));
  $("#main").innerHTML = cards.join("") +
    `<p class="note"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> open ·
     <kbd>c</kbd> copy answers · <kbd>t</kbd> theme</p>`;
}

async function copyFor(slug) {
  const cfg = await (await fetch(`${slug}/config.json`, { cache: "no-store" })).json();
  const txt = answerStringOf(cfg, stateOf(cfg));
  try { await navigator.clipboard.writeText(txt); } catch { prompt("Copy this:", txt); }
  $("#toast").classList.add("on");
  setTimeout(() => $("#toast").classList.remove("on"), 1600);
}

document.body.addEventListener("click", e => {
  if (e.target.matches("button.copy")) copyFor(e.target.dataset.slug);
});
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
  const rows = $$(".page");
  const move = i => { FOCUS = Math.max(0, Math.min(i, rows.length - 1));
    rows.forEach(r => r.classList.remove("focused"));
    rows[FOCUS]?.classList.add("focused");
    rows[FOCUS]?.scrollIntoView({ block: "center", behavior: "smooth" }); };
  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); move(FOCUS + 1); break;
    case "k": case "ArrowUp": e.preventDefault(); move(FOCUS - 1); break;
    case "Enter": if (rows[FOCUS]) location.href = rows[FOCUS].dataset.slug + "/"; break;
    case "c": if (rows[FOCUS]) copyFor(rows[FOCUS].dataset.slug); break;
    case "t": $("#theme").click(); break;
  }
});
$("#theme").onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("decision-hub:theme", r.dataset.theme);
};
document.documentElement.dataset.theme =
  localStorage.getItem("decision-hub:theme") || "dark";
window.addEventListener("focus", render);
render();
</script>
</body>
</html>
