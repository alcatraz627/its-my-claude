<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kanban · drafts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='4' height='12' rx='1.5' fill='%235b9dff'/%3E%3Crect x='6' y='2' width='4' height='8' rx='1.5' fill='%23e3b341'/%3E%3Crect x='11' y='2' width='4' height='5' rx='1.5' fill='%2334373f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared.css">
<style>
  /* kanban — drafts. Same skin as hub and board; the canvas is an editor rather
     than a list, so the writing column gets the room and everything else gets
     out of its way. */
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
       display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);flex:none}
  h1{margin:0;font:600 15.5px/1.3 var(--sans);letter-spacing:-.011em;flex:1}
  /* This page links shared.css and then re-declared button on top of it, which
     shadowed the one place the solid/outlined/text vocabulary lives. Two of six
     variants were in use, the page hand-rolled its own solid and danger, and a
     disabled button computed cursor:default where the standard says not-allowed.
     Only the padding is kept, because this toolbar is denser than the board's. */
  button{padding:5px 9px;font-size:12.5px;font-weight:500}
  a{color:var(--blue)}
  .views{display:flex;gap:4px}
  .views a,.views button{display:inline-flex;align-items:center;text-decoration:none;border-radius:6px;
         border:1px solid var(--border);background:var(--card);color:var(--text-2);padding:5px 9px;font-size:12.5px;font-weight:500}
  .views .on{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

  main{flex:1;min-height:0;display:flex}
  /* the list is context, so it stays narrow and lets the writing column breathe */
  aside{width:286px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .atop{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}
  .atop .new{background:var(--blue);border-color:transparent;color:var(--canvas);font-weight:600}
  [data-theme="light"] .atop .new{color:#fff}
  .atop .new:hover{background:var(--blue);border-color:transparent;filter:brightness(1.08)}
  .alist{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:14px;flex:1}
  .glabel{font:600 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 4px 6px}
  .drow{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;
        padding:8px 10px;color:var(--text);font-size:12.5px;line-height:1.45}
  .drow:hover{background:var(--well);border-color:var(--border)}
  .drow.on{background:var(--card);border-color:var(--blue-br)}
  .drow .dh{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow.pulled .dh{color:var(--text-3);text-decoration:line-through}
  .drow .dm{margin-top:3px;font-size:11.5px;color:var(--text-3);display:flex;gap:7px;flex-wrap:wrap}
  .drow .dm .now{color:var(--amber)}
  .drow .dm .tpl{color:var(--blue)}
  .aempty{color:var(--text-3);font-size:12.5px;padding:8px 4px}

  section.edit{flex:1;min-width:0;display:flex;flex-direction:column}
  .etop{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
  .etop input.title{flex:1;min-width:150px;background:transparent;border:1px solid transparent;border-radius:6px;
                    color:var(--text);font:600 14px/1.4 var(--sans);padding:5px 8px}
  .etop input.title:hover{border-color:var(--border)}
  .etop input.title:focus{outline:none;background:var(--well);border-color:var(--blue)}
  /* the editor's pickers are searchSelect now; this rule is kept for any
     native select the page still grows */
  .etop select{font:inherit;font-size:12px;background:var(--card);color:var(--text-2);
               border:1px solid var(--border);border-radius:6px;padding:5px 7px;max-width:190px}
  /* Handing a draft over is the consequential act on this page, so it wears the
     solid treatment; everything else beside it stays outlined. */
  .etop .sendnow{background:var(--blue-bg);border-color:var(--blue-br);color:var(--blue);font-weight:600}
  .etop .sendnow:hover{background:var(--blue);border-color:transparent;color:var(--canvas)}
  [data-theme="light"] .etop .sendnow:hover{color:#fff}
  .etop .forsel{max-width:210px}
  /* the three-way mode control: one holder, so the three read as one choice */
  .modes{display:inline-flex;gap:2px;background:var(--canvas);border:1px solid var(--border);
         border-radius:7px;padding:2px}
  .modes .modebtn{border:none;background:none;padding:3px 9px;font-size:12px;border-radius:5px;color:var(--text-3)}
  .modes .modebtn:hover{background:var(--well);color:var(--text-2)}
  .modes .modebtn.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  /* Live: rendered lines, with the caret's line showing its raw markdown. The
     raw line keeps the mono face so the swap reads as the same text in two
     dresses rather than as two different things. */
  .ebody.live{display:block;overflow:auto}
  .ebody.live .livepane{min-height:100%}
  .livepane{display:block;width:100%;padding:18px 22px}
  .lrend{font:13.5px/1.75 var(--sans);color:var(--text-2);padding:1px 6px;margin:0 -6px;
         border-radius:5px;cursor:text;min-height:1.75em}
  .lrend:hover{background:var(--well)}
  .lrend .lh1,.lrend .lh2,.lrend .lh3{color:var(--text);font-weight:600}
  .lrend .lh1{font-size:19px} .lrend .lh2{font-size:16px} .lrend .lh3{font-size:14.5px}
  .lrend .lbul{color:var(--text-3)}
  .lrend .lq{color:var(--text-3);border-left:2px solid var(--blue-br);padding-left:8px;display:inline-block}
  .lrend code,.lraw code{font:11.5px var(--mono);background:var(--well);border:1px solid var(--border);
                         border-radius:4px;padding:1px 4px}
  .lraw{display:block;width:100%;resize:none;overflow:hidden;background:var(--well);
        border:1px solid var(--blue-br);border-radius:5px;color:var(--text);
        font:13px/1.75 var(--mono);padding:0 6px;margin:0 -7px}
  .lraw:focus{outline:none;border-color:var(--blue)}
  .drow .dm .dto{color:var(--blue)}
  .drow .dm .dpull{color:var(--text-3)}
  /* §5: the glyph accompanies the label, it never replaces it. One rule so the
     whole row lines up instead of each button deciding for itself. */
  .etop button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .etop button svg{flex:none}
  /* .save is shared.css's .accent and .del is its .danger; both are applied in
     the markup now rather than re-described here. */
  .etop .save:disabled{background:var(--card);color:var(--text-3);border-color:var(--border)}
  .etop .on{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  .ebody{flex:1;min-height:0;display:flex}
  .ebody.split .pane{width:50%}
  .pane{width:100%;min-width:0;display:flex}
  /* The direction memo's finding, built. The writing surface used to sit on the
     page's own ground with no border, measured identical to body in both themes,
     while every control above it was raised onto --card. The thing you touch was
     the least defined object on screen, which is why it read as a hole rather
     than as paper. It is now the raised object and the page is its frame. */
  .ebody{padding:14px 16px;gap:14px}
  textarea{flex:1;width:100%;background:var(--card);color:var(--text);resize:none;
           border:1px solid var(--border);border-radius:9px;
           padding:16px 18px;font:13.5px/1.65 var(--mono);tab-size:2;
           transition:border-color .14s,box-shadow .14s}
  /* Textural, not thematic: the surface answers where the hand is. The border
     lifts and a soft ring appears on the object being written in, and nothing
     else on the page moves. */
  textarea:focus{outline:none;border-color:var(--blue-br);
                 box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 11%,transparent)}
  /* Raw and rendered are two dresses on one text, so they are told apart by
     depth rather than by decoration: raw is the raised card you type on, rendered
     is recessed into the well behind it. */
  .ebody.split .prev{background:var(--well);border:1px solid var(--border);border-radius:9px}
  .livepane{background:var(--card);border:1px solid var(--border);border-radius:9px}
  .prev{flex:1;overflow-y:auto;padding:18px 22px;font-size:13.5px;line-height:1.65}
  .prev h1,.prev h2,.prev h3{letter-spacing:-.011em;margin:1.2em 0 .5em;line-height:1.3}
  .prev h1{font-size:20px} .prev h2{font-size:16.5px} .prev h3{font-size:14px}
  .prev h1:first-child,.prev h2:first-child,.prev h3:first-child{margin-top:0}
  .prev p,.prev ul,.prev ol{margin:.7em 0}
  .prev code{font:12.5px var(--mono);background:var(--well);border:1px solid var(--border);border-radius:4px;padding:1px 4px}
  .prev pre{background:var(--well);border:1px solid var(--border);border-radius:8px;padding:11px 13px;overflow-x:auto}
  .prev pre code{background:none;border:none;padding:0}
  .prev table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow-x:auto}
  .prev th,.prev td{border:1px solid var(--border);padding:5px 9px;text-align:left}
  .prev th{background:var(--well)}
  .estat{padding:7px 18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);
         display:flex;gap:10px;align-items:center;flex:none;flex-wrap:wrap}
  .estat .dirty{color:var(--amber)}
  .estat .err{color:var(--red)}
  .estat .ok{color:var(--green)}
  .estat .spacer{flex:1}
  /* the agent's pull note yields before the save state does: it shrinks to an
     ellipsis, the full text rides the tooltip, and "saved" stays on screen */
  .estat .pnote{flex:0 1 auto;min-width:0;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nothing{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-3);padding:40px;text-align:center}
  #banner{margin:0;padding:9px 18px;border-bottom:1px solid var(--red-br);background:var(--red-bg);color:var(--red);font-size:12.5px;display:none}
</style>
</head>
<body>
<header id="phead"></header>
<p id="banner"></p>
<main>
  <aside>
    <div class="atop">
      <button class="new" id="newDraft" type="button" data-verb="add" data-tip="Start a new document (n)">New draft</button>
      <span id="tplNewMount"></span>
    </div>
    <div class="alist" id="list"><div class="aempty">Loading…</div></div>
  </aside>
  <section class="edit" id="edit"></section>
</main>
<script src="/kinds.js"></script>
<script src="/shared.js"></script>
<script>
// Drafts is a real page rather than a view, so it navigates rather than
// switching in place. Before this it offered two links and no route to Asks at
// all, which is the partial-graph defect the audit named.
// The same identity the board wears: `All drafts / <the one you are reading>`,
// rather than a title block only this page had. The instance half is filled in
// by mountNav() whenever the open draft changes.
// one find element for the page's lifetime: remounts move it, never re-wire it
const pageFind = kindFind();
function mountNav() {
  navbar({ mount: "#phead", active: "drafts",
    identity: crumbFor("drafts", currentDraftName()),
    find: pageFind,
    help: () => theHelp && theHelp.open() });
}
// The draft currently open, by the name a person would call it. Nothing open is
// the index, and the crumb correctly shows no instance half.
function currentDraftName() {
  if (!currentId) return "";
  const d = (drafts ?? []).find((x) => x.id === currentId);
  if (!d) return "";
  // An untitled draft is named by its first real line, which is routinely a
  // markdown heading, so the marks come off. Otherwise the crumb reads
  // "All drafts / ## gcc-work" and shows the syntax rather than the name.
  return d.title || firstLineName(d.body, 48) || "(untitled)";
}

// The keyboard reference, on this page too. `?` opens it; the rows are
// generated from SHARED_KEYS so they cannot drift from the bindings.
// Every entry names something this page renders, so a word here can be checked
// against the screen.
const DRAFT_TERMS = [
  { title: "Draft", rel: ["ask", "pull", "save"],
    p: "A draft is a document of yours, the rung above an ask: longer, kept, and edited over time rather than written once. It lives here rather than on a board because it is not about one project yet. Nothing is written to disk until you save, and the page says so plainly instead of pretending an autosave happened.",
    do: "Use it for the thought that is too big to be one line.",
    dont: "Do not assume it saved. Nothing is on disk until you press save." },
  { title: "Pull", rel: ["draft", "agent", "consumed"],
    p: "A pull is an agent taking a draft and doing something with it. That is what turns a document into project material, and it is the moment a draft stops waiting. The agent leaves a note saying what it did, so the record is the agent's own words rather than a status flag. Pulling consumes an ordinary draft, and a pull can be undone.",
    do: "Read the pull note. It says what your document became.",
    dont: "Do not rewrite a pulled draft expecting it to be re-read. Offer it again instead." },
  { title: "Template", rel: ["draft", "pull"],
    p: "A template is a draft that is reused rather than consumed, so pulling one never takes it out of the list. That single difference is the whole of it: everything else about a template behaves like a draft. It exists because some documents are a shape you want filled in again next week, not a message delivered once.",
    do: "Make one of anything you would otherwise rewrite from memory.",
    dont: "Do not make a one-off a template. A list of templates you never reuse is a list you stop reading." },
  { title: "Offered", rel: ["pull", "agent", "now"],
    p: "Offering a draft asks a session to pick it up now rather than whenever it next sweeps. It is the one place on this page that pushes instead of waiting, and it is reversible: an offer can be withdrawn while nobody has acted on it. A draft that is offered is still an ordinary draft in every other respect.",
    do: "Offer the one that is blocking somebody, and let the rest wait.",
    dont: "Do not offer everything. If all of it is urgent then none of it is marked." },
  { title: "For", rel: ["draft", "agent"],
    p: "Every draft is addressed. Anyone means whoever sweeps next, which is the usual case and the reason it is the default. Naming an agent narrows it to them, and that also hides it from the others, so an addressed draft is a choice about who does not see it as much as about who does.",
    do: "Leave it as anyone unless a specific session is the only one who can act.",
    dont: "Do not name a session that is not running. Nobody sweeps on its behalf." },
  { title: "Edit, Live and Preview", rel: ["draft", "markdown"],
    p: "Three ways to look at the same text. Edit is the raw markdown. Live renders each line as you leave it, which is a per-line view and deliberately does not handle constructs that span lines. Preview asks the server to render the whole document properly, which is why it is kept: it is the one that shows you what a reader will actually see.",
    do: "Write in Edit or Live, and check the finished shape in Preview.",
    dont: "Do not judge a table or a code block from Live. Spanning constructs are not its job." },
];

registerHelp(helpModal({
  id: "help", title: "Drafts, explained", sub: "the words, the keys and what we agreed",
  tabs: [
    { id: "keys", label: "Keyboard", sub: "Shortcuts",
      build: (pane) => fillKeys(pane, SHARED_KEYS.concat([{ group: "Here", rows: [["\u2318\u21b5", "save the draft you are editing"]] }])) },
    termsTab(DRAFT_TERMS),
    charterTab(),
  ],
}));



const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const banner = (msg) => {
  const b = document.getElementById("banner");
  b.textContent = msg ?? "";
  b.style.display = msg ? "block" : "none";
};

let drafts = [], boards = [], currentId = null, broken = null;
// The unsaved buffer is separate from the saved record, so a poll or a list
// click can never overwrite what the owner has typed but not yet saved.
let buf = null;          // {title, body} while editing
let saved = null;        // the record as the server last confirmed it
let mode = localStorage.getItem("kanban-draft-mode")
  || (localStorage.getItem("kanban-draft-preview") === "1" ? "preview" : "edit");
let liveAt = 0;                       // which source line is showing its raw text
const previewOn = () => mode === "preview";
const G = {
  preview:  `<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M.9 7S3.1 3.1 7 3.1 13.1 7 13.1 7 10.9 10.9 7 10.9.9 7 .9 7Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.7" stroke="currentColor" stroke-width="1.15"/></svg>`,
  template: `<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><rect x="2.2" y="1.6" width="7.4" height="9.4" rx="1.2" stroke="currentColor" stroke-width="1.15"/><path d="M4.6 12.9h5.6a1.2 1.2 0 0 0 1.2-1.2V4.4" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>`,
  offer:    `<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M12.4 1.6 6.6 7.4M12.4 1.6 8.5 12.4 6.6 7.4 1.6 5.5 12.4 1.6Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg>`,
  del:      `<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2.4 3.7h9.2M5.4 3.7V2.5h3.2v1.2M3.6 3.7l.6 8a.9.9 0 0 0 .9.8h3.8a.9.9 0 0 0 .9-.8l.6-8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  save:     `<svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2.4 7.3 5.6 10.5 11.6 3.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
let agents = [];
let status = null;       // {kind: "ok"|"err", msg}

const KEY = (id) => `kanban-draftbuf-${id ?? "new"}`;
// An unsaved new draft has no record yet, so "dirty" means it has any content at
// all. The server refuses to store an empty draft, and it is right to: clicking
// New should not put junk on disk before the owner has written anything.
const dirty = () => !!buf && (saved
  ? buf.title !== (saved.title ?? "") || buf.body !== saved.body
  : !!(buf.title.trim() || buf.body.trim()));

const post = async (patch) => {
  const res = await fetch("/api/draft", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(patch) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error ?? `HTTP ${res.status}`);
  return out;
};

async function load({ keepBuffer = true } = {}) {
  let res;
  try { res = await (await fetch("/api/drafts")).json(); }
  catch (e) { banner(`could not reach the server: ${e.message}`); return; }
  // a store that will not parse must say so; an empty list would read as "no
  // drafts" and the owner would assume their writing was never saved
  broken = res.broken ?? null;
  banner(broken ? `Your drafts file will not parse, so none can be shown. Nothing else is affected. Fix or trash ~/.claude/kanban/drafts.json. ${broken}` : null);
  drafts = res.drafts ?? [];
  if (!boards.length) {
    try { boards = (await (await fetch("/api/boards")).json()).boards ?? []; } catch { boards = []; }
  }
  // Who is around to be addressed. Rebuilt every load rather than cached: an
  // alias goes stale on its own clock and a stale "live" is worse than no list,
  // because the owner would address a draft to somebody who cannot be reached.
  agents = [...new Set(boards.flatMap((b) => (b.live ?? []).map((p) => p.alias)))].sort();
  if (currentId && !drafts.some((d) => d.id === currentId)) { currentId = null; buf = null; saved = null; }
  if (!keepBuffer || !buf) selectFromUrl();
  // "A poll must never touch the editor" — the list is worth refreshing, the words
  // being typed are not the server's to replace. Rebuilding the editor was touching
  // it, however faithfully the text was copied back.
  render({ editor: !(keepBuffer && buf) });
}

function selectFromUrl() {
  const want = new URLSearchParams(location.search).get("d");
  if (want && drafts.some((d) => d.id === want)) open(want, { push: false });
  else if (!currentId && drafts.length) open(drafts[0].id, { push: false });
  else if (!drafts.length) { currentId = null; buf = null; saved = null; }
}

function open(id, { push = true } = {}) {
  if (dirty() && !confirm("This draft has unsaved changes. Discard them?")) return;
  const d = drafts.find((x) => x.id === id);
  if (!d) return;
  currentId = id;
  saved = { title: d.title, body: d.body };
  // a crash-recovered buffer wins over the saved text, since it is the newer
  // thing the owner typed and losing it is the only unrecoverable outcome here
  const stash = localStorage.getItem(KEY(id));
  buf = stash ? JSON.parse(stash) : { title: d.title ?? "", body: d.body };
  // Per-draft history, so undo never walks you into another draft's text.
  histLoad(id);
  if (!hist.past.length) { hist.past.push({ title: buf.title, body: buf.body }); histSave(); }
  status = null;
  if (push) history.replaceState(null, "", `/drafts?d=${id}`);
  render();
}

// Nothing is written until the first save, so a new draft lives only in the
// buffer. Seeding it from a template is the same act with the text pre-filled.
function newDraft(seed) {
  if (dirty() && !confirm("This draft has unsaved changes. Discard them?")) return;
  localStorage.removeItem(KEY(null));   // a fresh start is not a crash recovery
  currentId = null;
  saved = null;
  buf = { title: seed?.title ?? "", body: seed?.body ?? "" };
  hist = { past: [{ title: buf.title, body: buf.body }], future: [] };
  status = null;
  history.replaceState(null, "", "/drafts");
  render();
  const ta = document.querySelector(".ebody textarea");
  if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
}

// Auto-save. The owner asked for it outright ("the editing surface needs to be
// auto-save=true"), which changes this page's old contract that nothing is
// written until you press Save.
//
// Two guards, because auto-saving is easy to make worse than manual saving:
//
//  - A draft that does not exist yet is NOT created on a keystroke. Every stray
//    character in a fresh editor would otherwise mint a draft, and the list is
//    the owner's, not a scratchpad. A new draft is born when they press Save,
//    and auto-save takes over from there.
//  - The debounce is generous. A save is a round trip and a write; firing one
//    per pause in typing is noise, and the crash stash already protects the text
//    on every keystroke, so nothing is at risk while this waits.
let autoTimer = null;
const AUTOSAVE_MS = 1500;
function scheduleAutoSave() {
  clearTimeout(autoTimer);
  if (!currentId) return;            // never create; only keep an existing one current
  autoTimer = setTimeout(() => { if (dirty()) save({ auto: true }); }, AUTOSAVE_MS);
}

async function save(opts = {}) {
  if (!buf) return;
  const creating = !currentId;
  if (creating && !buf.title.trim() && !buf.body.trim()) {
    status = { kind: "err", msg: "write something first" };
    paintStatus();
    return;
  }
  try {
    const out = await post({ ...(currentId ? { id: currentId } : {}), title: buf.title, body: buf.body });
    localStorage.removeItem(KEY(currentId));
    if (out.deleted) { currentId = null; buf = null; saved = null; history.replaceState(null, "", "/drafts"); }
    else {
      currentId = out.id;
      saved = { title: buf.title || undefined, body: buf.body };
      history.replaceState(null, "", `/drafts?d=${out.id}`);
    }
    // An auto-save says so, quietly. Reporting it as "saved" the same way a
    // deliberate save does would make the owner unsure which one happened.
    status = { kind: "ok", msg: out.deleted ? "deleted" : creating ? "created"
      : opts.auto ? "saved automatically" : "saved" };
    await load({ keepBuffer: true });
  } catch (e) { status = { kind: "err", msg: e.message }; render(); }
}

async function patch(fields, note) {
  if (!currentId) return;
  try {
    await post({ id: currentId, ...fields });
    status = { kind: "ok", msg: note };
    await load({ keepBuffer: true });
  } catch (e) { status = { kind: "err", msg: e.message }; render(); }
}

function listEl() {
  const wrap = el("div", null);
  const groups = [
    ["Waiting to be pulled", drafts.filter((d) => !d.isTemplate && !d.consumed)],
    ["Templates", drafts.filter((d) => d.isTemplate)],
    ["Pulled", drafts.filter((d) => !d.isTemplate && d.consumed)],
  ];
  let any = false;
  for (const [label, rows] of groups) {
    if (!rows.length) continue;
    any = true;
    const g = el("div", "group");
    g.append(el("div", "glabel", `${label} · ${rows.length}`));
    for (const d of rows) {
      const b = el("button", "drow" + (d.id === currentId ? " on" : "") + (d.consumed ? " pulled" : ""));
      b.type = "button";
      const head = d.title || d.body.split("\n").find((l) => l.trim()) || "(empty)";
      b.append(el("div", "dh", head));
      const m = el("div", "dm");
      m.append(el("span", null, `${d.body.split("\n").length}L`));
      m.append(el("span", null, `${ago(Date.parse(d.updatedAt))} ago`));
      // Who it is for and what became of it, both on the row: the owner could
      // address and hand over a draft but had nowhere to SEE either.
      if (d.to?.length) {
        const to = el("span", "dto", d.to.map((t) => t.replace(/^agent:/, "\u2192 ")
                                                      .replace(/^board:/, "\u2192 ")).join(" "));
        m.append(to);
      }
      if (d.consumed && d.pull) {
        m.append(el("span", "dpull", `read ${ago(Date.parse(d.pull.at))} ago`));
      } else if (d.pull) {
        // a pull exists but it is spent, which is the state the diff explains
        m.append(el("span", "now", "revised since"));
      }
      if (d.boardName) m.append(el("span", null, d.boardName));
      if (d.isTemplate) m.append(el("span", "tpl", "template"));
      if (d.triggered && !d.pull) m.append(el("span", "now", "offered"));
      b.append(m);
      b.onclick = () => open(d.id);
      g.append(b);
    }
    wrap.append(g);
  }
  // An unreadable store is not an empty one. Saying "nothing written yet" over a
  // file that failed to parse tells the owner their writing is gone.
  if (!any) wrap.append(el("div", "aempty", broken
    ? "Your drafts cannot be read, so none are listed. They are not gone; see the message above."
    : "Nothing written yet. A draft is for the thought that is too big for the ask box."));
  return wrap;
}

function editorEl() {
  if (!buf) {
    const n = el("div", "nothing");
    n.append(el("div", null, broken ? "Fix the drafts file before writing more, or a new draft could be the only one left."
      : drafts.length ? "Pick a draft on the left, or start a new one."
      : "Start a draft to write something out properly."));
    return [n];
  }
  // Undefined while the draft is still unsaved. Everything that acts on a stored
  // record (template, offer, board, delete) waits until there is one to act on.
  const d = drafts.find((x) => x.id === currentId);
  const top = el("div", "etop");
  const title = el("input", "title");
  title.type = "text"; title.value = buf.title; title.placeholder = "Untitled";
  title.setAttribute("aria-label", "draft title, optional");
  title.oninput = () => { buf.title = title.value; stash(); paintStatus(); scheduleAutoSave(); histRecord(); };
  top.append(title);

  // The three editor pickers were native selects while the same page already
  // used searchSelect for the template-new control. Same control everywhere now.
  const tplOpts = drafts.filter((x) => x.isTemplate).map((t) => ({
    value: t.id,
    label: (t.title || t.body.split("\n").find((l) => l.trim()) || t.id).slice(0, 40) }));
  const tpl = searchSelect({
    aria: "insert a template at the cursor", placeholder: "insert template…",
    tip: "Drop a template's text in at the caret",
    options: tplOpts, value: "",
    onPick: (v) => { const t = drafts.find((x) => x.id === v); tpl.set(""); if (t) insertAtCursor(t.body); } });
  tpl.disable(!tplOpts.length);
  top.append(tpl.el);

  if (d) {
    const board = searchSelect({
      aria: "board, optional", placeholder: "no board",
      tip: "Which board this draft lives on",
      options: [{ value: "", label: "no board" },
                ...boards.map((b) => ({ value: b.slug, label: b.name }))],
      value: d.slug ?? "",
      onPick: (v) => patch({ slug: v || null }, v ? "attached" : "detached") });
    top.append(board.el);
  }

  // Who this draft is FOR, which is a different question from which board it
  // lives on. Absent means anyone, which is what every draft was until today.
  const forOpts = [{ value: "", label: "For: anyone" },
    ...agents.map((a) => ({ value: `agent:${a}`, label: `For: ${a}` })),
    ...boards.map((b) => ({ value: `board:${b.slug}`, label: `For: ${b.name} (board)` }))];
  const cur = (buf.to ?? saved?.to ?? d?.to ?? [])[0] ?? "";
  // An alias that has since gone quiet must still show as the current answer, or
  // the control would silently claim the draft is for anyone.
  if (cur && !forOpts.some((o) => o.value === cur)) {
    forOpts.push({ value: cur, label: `For: ${cur.replace(/^agent:/, "")} (not live)` });
  }
  const forSel = searchSelect({
    aria: "who this draft is for", placeholder: "For: anyone",
    tip: "Who it is for. Anyone means whoever sweeps; naming one hides it from the rest",
    options: forOpts, value: cur,
    onPick: async (v) => {
    try {
      const res = await fetch("/api/draft", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: currentId, to: v ? [v] : [] }) });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error ?? res.status);
      status = { kind: "ok", msg: v ? `for ${v}` : "for anyone" };
      await load({ keepBuffer: true });
      // load() deliberately leaves the editor alone while the owner is mid-edit,
      // which is what stops the poll eating keystrokes. A recipient change is not
      // the poll: it is a deliberate act whose whole result is a control that has
      // to appear or disappear, so it asks for the rebuild explicitly. render()
      // hands focus and caret back, so asking is safe.
      render();
    } catch (e) { status = { kind: "err", msg: e.message }; render(); }
  } });
  forSel.disable(!currentId);
  forSel.el.classList.add("forsel");
  top.append(forSel.el);

  // Handing it over is a different act from leaving it out, so it is a different
  // control. It appears only when there is somebody named to hand it to.
  if (cur.startsWith("agent:")) {
    const send = el("button", "sendnow accent");
    send.innerHTML = G.offer + `<span>Send to ${cur.slice(6)}</span>`;
    send.type = "button";
    send.dataset.tip = "Push it at them now. It stays waiting either way.";
    send.onclick = async () => {
      send.disabled = true;
      try {
        const res = await fetch("/api/draft-send", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: currentId }) });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error ?? res.status);
        // Reaching nobody is reported, not swallowed. "Sent" over silence is the
        // shape that hid the owner's own feedback for a day.
        status = out.sent?.length
          ? { kind: "ok", msg: `handed to ${out.sent.join(", ")}` }
          : { kind: "err", msg: out.reason || "nobody received it" };
      } catch (e) { status = { kind: "err", msg: e.message }; }
      send.disabled = false;
      paintStatus();
    };
    top.append(send);
  }

  // Three surfaces, not two. The owner's reason for keeping all three is that a
  // third one helps when something renders wrong, so Edit must always be able to
  // show the raw text on its own.
  const modes = el("div", "modes");
  for (const [k, label, tip] of [
    ["edit", "Edit", "The raw markdown, nothing rendered"],
    ["live", "Live", "Rendered as you write; only the line you are on shows its raw markdown"],
    ["preview", "Preview", "Raw and rendered side by side"],
  ]) {
    const mb = el("button", "modebtn" + (mode === k ? " on" : ""), label);
    mb.type = "button"; mb.dataset.tip = tip;
    mb.onclick = () => { mode = k; localStorage.setItem("kanban-draft-mode", k); render(); };
    modes.append(mb);
  }
  top.append(modes);

  if (d) {
  const tplBtn = el("button", d.isTemplate ? "on" : null);
  tplBtn.innerHTML = G.template + `<span>${d.isTemplate ? "Template" : "Make template"}</span>`;
  tplBtn.type = "button";
  tplBtn.dataset.tip = d.isTemplate
    ? "A template is reused rather than consumed, so it never waits to be pulled. Click to make it an ordinary draft."
    : "Mark this as a template so you can reuse its text. Select some text first to make a template of just that part.";
  tplBtn.onclick = () => {
    const ta = document.querySelector(".ebody textarea");
    const sel = ta && ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
    // A selection makes a template of the fragment (D5's "snippets"), which is
    // the same act at a smaller scale, so it is the same control.
    if (!d.isTemplate && sel) {
      post({ body: sel, template: true })
        .then(() => { status = { kind: "ok", msg: "selection saved as a template" }; return load({ keepBuffer: true }); })
        .catch((e) => { status = { kind: "err", msg: e.message }; render(); });
      return;
    }
    patch({ template: !d.isTemplate }, d.isTemplate ? "now an ordinary draft" : "now a template");
  };
  top.append(tplBtn);

  if (!d.isTemplate) {
    const offer = el("button", d.triggered ? "on" : null);
    offer.innerHTML = G.offer + `<span>${d.triggered ? "Offered" : "Offer to a session"}</span>`;
    offer.type = "button";
    offer.dataset.tip = d.triggered ? "A session has been asked to pick this up now. Click to withdraw."
      : "Ask a working session to pick this up now, rather than at its next sweep.";
    offer.onclick = () => patch({ trigger: !d.triggered }, d.triggered ? "withdrawn" : "offered");
    top.append(offer);
  }
  }

  if (d) {
  const del = el("button", "del danger");
  del.innerHTML = G.del + `<span>Delete</span>`;
  del.dataset.tip = "Delete this draft. It cannot be undone.";
  del.type = "button";
  del.onclick = async () => {
    if (!confirm("Delete this draft? This cannot be undone.")) return;
    try {
      await post({ id: currentId, body: "", title: "" });
      localStorage.removeItem(KEY(currentId));
      currentId = null; buf = null; saved = null;
      history.replaceState(null, "", "/drafts");
      status = { kind: "ok", msg: "deleted" };
      await load({ keepBuffer: false });
    } catch (e) { status = { kind: "err", msg: e.message }; render(); }
  };
  top.append(del);
  }

  const saveBtn = el("button", "save accent");
  saveBtn.innerHTML = G.save + `<span>Save</span>`;
  saveBtn.dataset.tip = "Write it to disk (\u2318S). Nothing is saved until you do.";
  saveBtn.type = "button"; saveBtn.id = "saveBtn";
  saveBtn.onclick = save;
  top.append(saveBtn);

  const body = el("div", "ebody" + (previewOn() ? " split" : "") + (mode === "live" ? " live" : ""));
  if (mode === "live") {
    body.append(liveEl());
    const st = el("div", "estat");
    st.id = "estat";
    return [top, body, st];
  }
  const pane = el("div", "pane");
  const ta = el("textarea");
  ta.value = buf.body;
  ta.spellcheck = true;
  ta.setAttribute("aria-label", "draft body, markdown");
  ta.placeholder = "# Write it out properly\n\nMarkdown. An agent pulls from this when you offer it.";
  ta.oninput = () => { buf.body = ta.value; stash(); paintStatus(); schedulePreview(); scheduleAutoSave(); histRecord(); };
  pane.append(ta);
  body.append(pane);
  if (previewOn()) {
    const p = el("div", "prev");
    p.id = "preview";
    p.innerHTML = "";
    body.append(p);
  }

  const stat = el("div", "estat");
  stat.id = "estat";
  return [top, body, stat];
}

// Live: the document reads as rendered, and only the line the caret is on shows
// its raw markdown. One continuous surface rather than a mode you toggle in and
// out of. Owner ruling 2026-08-22 (Q2=B): this JOINS Edit and Preview, it does
// not replace either, because a third surface is what you compare against when
// something renders wrong.
function liveEl() {
  const wrap = el("div", "livepane");
  const lines = buf.body.split("\n");
  liveAt = Math.max(0, Math.min(liveAt, lines.length - 1));
  lines.forEach((raw, i) => {
    if (i === liveAt) {
      const inp = el("textarea", "lraw");
      inp.value = raw;
      inp.rows = 1;
      inp.spellcheck = true;
      inp.setAttribute("aria-label", `line ${i + 1}, raw markdown`);
      inp.oninput = () => {
        const next = buf.body.split("\n");
        next[i] = inp.value.replace(/\n/g, " ");
        buf.body = next.join("\n");
        stash(); paintStatus(); scheduleAutoSave(); histRecord();
      };
      inp.onkeydown = (e) => {
        // Enter splits the line, the arrows walk it, and everything else is the
        // browser's. A line editor that swallowed Enter would not be an editor.
        if (e.key === "Enter") {
          e.preventDefault();
          const at = inp.selectionStart;
          const next = buf.body.split("\n");
          next.splice(i, 1, inp.value.slice(0, at), inp.value.slice(at));
          buf.body = next.join("\n"); liveAt = i + 1; stash(); render();
        } else if (e.key === "ArrowUp" && inp.selectionStart === 0 && i > 0) {
          e.preventDefault(); liveAt = i - 1; render();
        } else if (e.key === "ArrowDown" && inp.selectionEnd === inp.value.length && i < lines.length - 1) {
          e.preventDefault(); liveAt = i + 1; render();
        } else if (e.key === "Backspace" && inp.selectionStart === 0 && inp.selectionEnd === 0 && i > 0) {
          e.preventDefault();
          const next = buf.body.split("\n");
          const join = next[i - 1].length;
          next.splice(i - 1, 2, next[i - 1] + inp.value);
          buf.body = next.join("\n"); liveAt = i - 1; stash(); render();
          const back = document.querySelector(".lraw");
          if (back) back.setSelectionRange(join, join);
        }
      };
      wrap.append(inp);
      return;
    }
    const ln = el("div", "lrend");
    ln.dataset.i = String(i);
    ln.innerHTML = liveRender(raw);
    ln.onclick = () => { liveAt = i; render(); };
    wrap.append(ln);
  });
  return wrap;
}

// A deliberately small renderer: this is a per-LINE view, so block constructs
// that span lines are not its job. The full document still renders through the
// server in Preview, which is one reason that mode is kept.
function liveRender(raw) {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  if (!raw.trim()) return "<br>";
  const h = raw.match(/^(#{1,6})\s+(.*)$/);
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  if (h) return `<span class="lh${h[1].length}">${inline(h[2])}</span>`;
  const li = raw.match(/^(\s*)[-*]\s+(.*)$/);
  if (li) return `<span class="lbul">&bull;</span> ${inline(li[2])}`;
  const q = raw.match(/^>\s?(.*)$/);
  if (q) return `<span class="lq">${inline(q[1])}</span>`;
  return inline(raw);
}

// Undo that survives what the browser's cannot. render() rebuilds the editor,
// which destroys the live element and with it the native undo stack, so ⌘Z used
// to lose everything the moment anything re-rendered. This history lives on the
// buffer instead, and is written beside the crash stash so it also survives a
// reload, which is the "persistent" half of the ask.
//
// Typing is coalesced: a snapshot lands once you pause, not once per keystroke,
// or a single sentence would take thirty presses to undo.
const HKEY = (id) => `kanban-draft-hist-${id ?? "new"}`;
const HIST_CAP = 60;
let hist = { past: [], future: [] };
let histTimer = null;

function histLoad(id) {
  try { hist = JSON.parse(localStorage.getItem(HKEY(id))) ?? { past: [], future: [] }; }
  catch { hist = { past: [], future: [] }; }
  if (!Array.isArray(hist.past) || !Array.isArray(hist.future)) hist = { past: [], future: [] };
}
function histSave() {
  try { localStorage.setItem(HKEY(currentId), JSON.stringify(hist)); } catch { /* quota: history is a nicety */ }
}
function histSnap() {
  if (!buf) return;
  const top = hist.past[hist.past.length - 1];
  const now = { title: buf.title, body: buf.body };
  if (top && top.title === now.title && top.body === now.body) return;
  hist.past.push(now);
  if (hist.past.length > HIST_CAP) hist.past.shift();
  hist.future = [];              // a new edit forks the timeline
  histSave();
}
function histRecord() { clearTimeout(histTimer); histTimer = setTimeout(histSnap, 600); }

function histApply(entry) {
  buf.title = entry.title; buf.body = entry.body;
  stash(); render();
}
function undo() {
  if (!buf) return;
  clearTimeout(histTimer);
  histSnap();                                     // capture what is on screen first
  if (hist.past.length < 2) { status = { kind: "err", msg: "nothing to undo" }; paintStatus(); return; }
  hist.future.push(hist.past.pop());
  histApply(hist.past[hist.past.length - 1]);
  histSave();
  status = { kind: "ok", msg: `undo · ${hist.past.length - 1} left` };
  paintStatus();
}
function redo() {
  if (!buf || !hist.future.length) { status = { kind: "err", msg: "nothing to redo" }; paintStatus(); return; }
  const e = hist.future.pop();
  hist.past.push(e);
  histApply(e);
  histSave();
  status = { kind: "ok", msg: "redo" };
  paintStatus();
}

function stash() {
  if (!buf) return;
  if (dirty()) localStorage.setItem(KEY(currentId), JSON.stringify(buf));
  else localStorage.removeItem(KEY(currentId));
}

function insertAtCursor(text) {
  const ta = document.querySelector(".ebody textarea");
  if (!ta || !buf) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  const joined = ta.value.slice(0, a) + text + ta.value.slice(b);
  buf.body = joined;
  ta.value = joined;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = a + text.length;
  stash();
  paintStatus();
  schedulePreview();
}

// Painted on its own so typing does not rebuild the editor and drop the caret.
function paintStatus() {
  const stat = document.getElementById("estat");
  if (!stat) return;
  const d = drafts.find((x) => x.id === currentId);
  stat.replaceChildren();
  const words = (buf?.body.match(/\S+/g) ?? []).length;
  stat.append(el("span", null, `${words} word${words === 1 ? "" : "s"}`));
  if (d?.pull) {
    const when = d.pull.at ? ` ${ago(Date.parse(d.pull.at))} ago` : "";
    const by = d.pull.by ? ` by ${String(d.pull.by).slice(0, 8)}` : "";
    const p = el("span", null, (d.consumed ? "pulled" : "pulled, then revised") + when + by);
    stat.append(p);
    if (d.pull.cardId && d.pull.slug) {
      const a = document.createElement("a");
      a.href = `/b/${d.pull.slug}?card=${d.pull.cardId}`;
      a.className = "pnote";
      a.textContent = d.pull.note || "the card it became";
      if (d.pull.note) a.dataset.tip = d.pull.note;
      stat.append(a);
    } else if (d.pull.note) {
      const n = el("span", "pnote", d.pull.note);
      n.dataset.tip = d.pull.note;
      stat.append(n);
    }
  }
  stat.append(el("span", "spacer"));
  if (status) stat.append(el("span", status.kind === "err" ? "err" : "ok", status.msg));
  if (dirty()) stat.append(el("span", "dirty", "unsaved · ⌘S"));
  const btn = document.getElementById("saveBtn");
  if (btn) btn.disabled = !dirty();
}

let previewTimer = null;
function schedulePreview() {
  if (!previewOn()) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 250);
}
async function renderPreview() {
  const p = document.getElementById("preview");
  if (!p || !buf) return;
  try {
    const res = await fetch("/api/mdpreview", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ body: buf.body }) });
    const out = await res.json();
    // renderMd escapes the source before it marks anything up, so what comes
    // back cannot carry tags the writer did not get through markdown itself.
    p.innerHTML = res.ok ? out.html : "";
    if (!res.ok) p.append(el("div", null, `preview unavailable: ${out.error ?? res.status}`));
  } catch (e) { p.textContent = `preview unavailable: ${e.message}`; }
}

// The editor is rebuilt wholesale by replaceChildren, which destroys the live
// <textarea> and with it the caret, the selection and the native undo stack. The
// text survives because buf is written on every keystroke; the CARET does not, and
// a textarea that is no longer focused receives no keystrokes at all. That is how
// characters went missing: the poll landed mid-edit, focus moved to <body>, and
// everything typed after it went nowhere.
//
// Two guards, because there are two ways in. Here: whatever had focus gets it back
// with its selection intact, which covers save() and open(). In load(): the editor
// is not rebuilt at all while the owner is mid-edit, which is what the poll's own
// comment already promised and the code did not keep.
function render({ editor = true } = {}) {
  mountNav();   // the crumb names the open draft, so it re-reads on every render
  document.getElementById("list").replaceChildren(listEl());
  const tpls = drafts.filter((d) => d.isTemplate)
    .map((x) => ({ value: x.id,
                   label: (x.title || x.body.split("\n").find((l) => l.trim()) || x.id).slice(0, 34) }));
  tplPick.setOptions(tpls);
  tplPick.disable(!tpls.length);
  if (editor) {
    const live = document.querySelector(".ebody textarea");
    const title = document.querySelector(".etop input.title");
    const held = document.activeElement === live && live
      ? { what: "body", start: live.selectionStart, end: live.selectionEnd }
      : document.activeElement === title && title
      ? { what: "title", start: title.selectionStart, end: title.selectionEnd }
      : null;
    document.getElementById("edit").replaceChildren(...editorEl());
    // Live's caret IS the raw line, so it has to arrive focused; otherwise the
    // mode looks editable and silently is not.
    if (mode === "live") {
      const raw = document.querySelector(".lraw");
      if (raw) { raw.focus(); raw.style.height = "auto"; raw.style.height = raw.scrollHeight + "px"; }
    }
    if (held) {
      const back = held.what === "body"
        ? document.querySelector(".ebody textarea")
        : document.querySelector(".etop input.title");
      if (back) { back.focus(); back.setSelectionRange(held.start, held.end); }
    }
  }
  paintStatus();
  if (previewOn()) renderPreview();
}

document.getElementById("newDraft").onclick = () => newDraft();
// the searchable picker, mounted once; render() refreshes its options
const tplPick = searchSelect({
  aria: "start from a template", placeholder: "from a template…",
  options: [], value: "",
  onPick: (v) => {
    const t = drafts.find((x) => x.id === v);
    tplPick.set("");
    if (t) newDraft({ body: t.body, title: t.title ? `${t.title} copy` : "" });
  } });
document.getElementById("tplNewMount").replaceWith(tplPick.el);
addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); save(); return; }
  // Ours, not the browser's: the native stack does not survive a re-render, so
  // letting the default through would undo into a stack that no longer exists.
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
});
// Losing typed text is the one unrecoverable outcome on this page, so the buffer
// is stashed on the way out as well as on every keystroke.
addEventListener("beforeunload", (e) => { stash(); if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
load({ keepBuffer: false });
// A poll must never touch the editor: the list is worth refreshing, the words
// the owner is typing are not the server's to replace.
setInterval(() => { if (!dirty()) load({ keepBuffer: true }); }, 15000);
</script>
</body>
