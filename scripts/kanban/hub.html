<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kanban · all boards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='4' height='12' rx='1.5' fill='%235b9dff'/%3E%3Crect x='6' y='2' width='4' height='8' rx='1.5' fill='%23e3b341'/%3E%3Crect x='11' y='2' width='4' height='5' rx='1.5' fill='%2334373f'/%3E%3C/svg%3E">
<style>
  /* kanban — v10 hub. Same skin as the board: system UI type, crisp accents,
     6px geometry, pills. Boards that want something from you sort first. */
  :root{
    --canvas:#131417; --well:#191b1f; --card:#212329; --card-hover:#282b32;
    --border:#2f333b; --border-2:#414651; --ring:#5b9dff;
    --text:#e9ebee; --text-2:#a4a9b1; --text-3:#8c939d;
    --blue:#5b9dff; --blue-bg:rgb(91 157 255/.12); --blue-br:rgb(91 157 255/.32);
    --amber:#e8b84b; --amber-bg:rgb(232 184 75/.12); --amber-br:rgb(232 184 75/.34);
    --red:#ed7666; --red-bg:rgb(237 118 102/.12); --red-br:rgb(237 118 102/.32);
    --green:#4bbd63;
    --shadow:0 1px 2px rgb(0 0 0/.4);
    --sans:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  [data-theme="light"]{
    --canvas:#e9ebef; --well:#f4f5f8; --card:#ffffff; --card-hover:#f7f8fa;
    --border:#d7dae1; --border-2:#b6bcc6; --ring:#0961bb;
    --text:#191c20; --text-2:#565d66; --text-3:#5f666f;
    --blue:#0961bb; --blue-bg:rgb(9 97 187/.12); --blue-br:rgb(9 97 187/.26);
    --amber:#8a5d05; --amber-bg:rgb(190 141 20/.12); --amber-br:rgb(150 108 12/.34);
    --red:#a1271e; --red-bg:rgb(161 39 30/.12); --red-br:rgb(161 39 30/.28);
    --green:#17752f;
    --shadow:0 1px 2px rgb(16 24 40/.06),0 1px 1px rgb(16 24 40/.04);
  }
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
  body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  svg{display:block;flex:none}
  /* The hub names itself and its three doors, the way the board's help modal
     does. Same idiom in both places rather than two inventions. */
  header{display:flex;align-items:center;gap:11px;padding:13px 24px;border-bottom:1px solid var(--border);
         background:var(--well)}
  .hmark{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
         background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-br)}
  .htx{display:flex;flex-direction:column;gap:2px;min-width:0}
  h1{margin:0;font:600 14.5px/1.2 var(--sans);letter-spacing:-.011em}
  .hsub{font:400 11.5px/1.2 var(--sans);color:var(--text-3)}
  .hsp{flex:1}
  button.ico{width:30px;height:30px;padding:0;display:grid;place-items:center;
             background:none;border-color:transparent;color:var(--text-3)}
  button.ico:hover{background:var(--card);border-color:var(--border);color:var(--text)}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text-2);
         padding:5px 9px;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s,color .12s}
  button:hover{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  main{max-width:900px;margin:24px auto;padding:0 24px;display:flex;flex-direction:column;gap:22px}
  .group{display:flex;flex-direction:column;gap:9px}
  .glabel{font:600 11.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
  #huberr{border:1px solid var(--red-br);background:var(--red-bg);border-radius:8px;padding:9px 12px;color:var(--red);font-size:13px}
  a.board{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;
          text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:background .12s,border-color .12s}
  a.board:hover{background:var(--card-hover);border-color:var(--border-2)}
  .row1{display:flex;align-items:center;gap:10px}
  .name{font-weight:600;font-size:13px;letter-spacing:-.008em}
  .badges{margin-left:auto;display:flex;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:20px;
        font:500 11.5px/1 var(--sans);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
  .pill.blk{color:var(--amber);border-color:var(--amber-br);background:var(--amber-bg);font-weight:600}
  .pill.unread{color:var(--text-2);border-color:var(--border);background:var(--well)}
  .root{color:var(--text-3);font:11.5px/1.5 var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .counts{color:var(--text-2);font-size:12.5px;margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .counts b{color:var(--text);font-weight:600}
  .counts .dotsep{width:3px;height:3px;border-radius:50%;background:var(--border-2)}
  .counts .stale{color:var(--amber)}
  .counts .ver{color:var(--green)}
  /* what the project IS, quieter than its counts */
  .facts{color:var(--text-3);font:11.5px/1.5 var(--sans);margin-top:2px}
  .pill.livep{font-family:var(--mono);font-size:11.5px}
  /* neutral, matching the board: blue means "you and your controls", so a
     peer-liveness dot is information rather than something you operate */
  .pill.livep i{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;flex:none}
  .pill.needs{color:var(--amber);border-color:var(--amber-br);background:var(--amber-bg);font-weight:600}
  a.board:focus-visible,a.quiet:focus-visible,button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  /* quiet boards: a row, not a card */
  a.quiet{display:flex;align-items:center;gap:12px;padding:8px 16px;text-decoration:none;color:var(--text-2);
          border:1px solid transparent;border-radius:8px}
  a.quiet:hover{background:var(--well);border-color:var(--border)}
  a.quiet .name{font-weight:550;font-size:13px;color:var(--text-2)}
  a.quiet .root{margin:0;flex:1;min-width:0}
  a.quiet .mini{font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .empty{color:var(--text-2);text-align:center;padding:60px 0}
  /* three peers, one holder, and each carries what it counts */
  .views{display:flex;gap:2px;background:var(--canvas);border:1px solid var(--border);
         border-radius:9px;padding:3px}
  .views button,.views a{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;
        border:1px solid transparent;background:none;border-radius:7px;color:var(--text-3);
        font:600 12.5px/1 var(--sans);text-decoration:none;transition:background .12s,color .12s,border-color .12s}
  .views button:hover,.views a:hover{background:var(--well);color:var(--text-2);border-color:transparent}
  .views .vi{flex:none;display:grid;place-items:center;color:currentColor}
  .views .vn{flex:none;font:600 11px/1 var(--mono);color:var(--text-3);background:var(--well);
             border-radius:20px;padding:2px 6px;min-width:20px;text-align:center}
  .views .vn:empty{display:none}
  .views .on{background:var(--card);border-color:var(--border);color:var(--text);box-shadow:var(--shadow)}
  .views .on .vn{color:var(--blue);background:var(--blue-bg)}
  .views kbd{font:10px var(--mono);color:var(--text-3)}
  /* Drafts is a destination, not a mode, so it is a link and not a view button */
  .views a{display:inline-flex;align-items:center;text-decoration:none;border-radius:6px;border:1px solid var(--border);
           background:var(--card);color:var(--text-2);padding:5px 9px;font-size:12.5px;font-weight:500}
  .views a:hover{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  .views button.on{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  /* a note row: the ask reads in full, its provenance stays quiet */
  a.note{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;
         text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
  a.note:hover{background:var(--card-hover);border-color:var(--border-2)}
  a.note .nb{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  a.note .nf{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
  a.note .nf .card{color:var(--text-2)}
  a.note .nf .wait{color:var(--amber)}
  .bone{background:var(--card);border:1px solid var(--border);border-radius:10px;height:62px;opacity:.55}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .filters button{font-family:var(--mono);font-size:11.5px}
  .filters button.on{background:var(--card-hover);border-color:var(--border-2);color:var(--text)}
  /* the owner's composer. blue is "you and your controls" here as on the board,
     and it needs no destination: an unassigned ask is routed later */
  .compose{background:var(--card);border:1px solid var(--blue-br);border-radius:10px;padding:12px 14px;
           display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
  .compose textarea{width:100%;background:var(--well);color:var(--text);border:1px solid var(--border);
                    border-radius:8px;height:74px;padding:10px 12px;font:13px/1.55 var(--sans);resize:vertical}
  .compose textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
  .compose .crow{display:flex;align-items:center;gap:8px}
  .compose .chint{flex:1;font-size:11.5px;color:var(--text-3)}
  .compose select{font:inherit;font-size:12.5px;background:var(--well);color:var(--text-2);
                  border:1px solid var(--border);border-radius:6px;padding:4px 7px}
  .compose .go{background:var(--blue);border-color:transparent;color:var(--canvas);font-weight:600;padding:6px 12px}
  [data-theme="light"] .compose .go{color:#fff}
  .compose .go:hover{background:var(--blue);border-color:transparent;filter:brightness(1.08)}
  .ask{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--border);
       border-radius:10px;padding:11px 14px;box-shadow:var(--shadow)}
  /* a star is an open instruction, so it stops shouting once the item is sorted */
  .ask.starred:not(.landed){border-color:var(--amber-br)}
  .ask.landed{background:none;box-shadow:none;padding:9px 12px}
  .ask .ab{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .ask.landed .ab{color:var(--text-3);font-size:12.5px}
  .ask .af{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
  .ask .af .shape{border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-family:var(--mono)}
  .ask .af a{color:var(--blue);text-decoration:none}
  .ask .af a:hover{text-decoration:underline}
  .ask .af .wait{color:var(--amber)}
  /* where an ask shows is the owner's call, so the control is theirs: blue on
     hover like the composer, quiet until reached for */
  .ask .route{margin-left:auto}
  .ask .route select{font:inherit;font-size:11.5px;background:transparent;color:var(--text-3);
                     border:1px solid transparent;border-radius:6px;padding:2px 4px;
                     max-width:246px;text-overflow:ellipsis}
  .ask .route select:hover{background:var(--well);border-color:var(--border);color:var(--text-2)}
  .ask .route select:focus{outline:none;background:var(--well);border-color:var(--blue);color:var(--text)}
  .ask .route.busy select{opacity:.5}
  .ask .af .rerr{color:var(--red)}
</style>
</head>
<body>
<header>
  <span class="hmark" id="hmark"></span>
  <span class="htx"><h1 id="htitle">Your boards</h1>
  <span class="hsub" id="hsub">every project an agent is working on for you</span></span>
  <span class="hsp"></span>
  <div class="views" role="tablist">
    <button id="vBoards" class="on" type="button" role="tab" data-k="1"><span class="vi"></span><span class="vt">Boards</span><span class="vn" id="nBoards"></span></button>
    <button id="vNotes" type="button" role="tab" data-k="2"><span class="vi"></span><span class="vt">Your asks</span><span class="vn" id="nAsks"></span></button>
    <a href="/drafts" data-k="3"><span class="vi"></span><span class="vt">Drafts</span></a>
  </div>
  <button id="theme" class="ico" title="toggle light and dark (t)" aria-label="toggle theme">◐</button>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const applyTheme = (t) => { document.documentElement.dataset.theme = t; document.body.dataset.theme = t; localStorage.setItem("kanban-theme", t); };
applyTheme(localStorage.getItem("kanban-theme") || "dark");
document.getElementById("theme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

// the board binds t for theme; the entry surface should not be the odd one out
document.addEventListener("keydown", (e) => {
  // optional call: a keydown whose target is the document has no .matches,
  // and the throw took the whole handler down with it
  if (e.target.matches?.("input,textarea")) return;
  if (e.key === "t") applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

const ago = (ms) => { const d = Date.now() - ms, h = d / 36e5; return h < 1 ? `${Math.max(1, Math.round(d / 6e4))}m` : h < 48 ? `${Math.round(h)}h` : `${Math.round(h / 24)}d`; };

// tail-keep truncation: the varying end of a path is the distinguishing part
function tailTrim(el) {
  const full = el.title || el.textContent;
  el.title = full; el.textContent = full;
  let guard = 300;
  while (el.scrollWidth > el.clientWidth && el.textContent.length > 12 && guard--) {
    el.textContent = "…" + el.textContent.replace(/^…/, "").slice(3);
  }
}
let trimTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(trimTimer);
  trimTimer = setTimeout(() => document.querySelectorAll(".root").forEach(tailTrim), 150);
});

function boardEl(b, quiet) {
  const a = document.createElement("a");
  a.href = `/b/${b.slug}`;
  const open = b.counts.inbox + b.counts.backlog + b.counts.active + b.counts.blocked;
  const ts = b.syncedAt ? Date.parse(b.syncedAt) : 0;
  const stale = ts && Date.now() - ts > 24 * 36e5;
  const sep = '<span class="dotsep"></span>';
  if (b.broken) {
    a.className = "board";
    a.innerHTML = `<div class="row1"><span class="name"></span><span class="badges"><span class="pill blk">unreadable</span></span></div><div class="root"></div>` +
      `<div class="counts"><span class="stale">This board's data will not parse. Nothing else is affected. Fix or trash <code>~/.claude/kanban/boards/${b.slug}</code>.</span></div>`;
    a.querySelector(".name").textContent = b.name;
    const re = a.querySelector(".root"); re.title = b.root; re.textContent = b.root;
    return a;
  }
  if (quiet) {
    a.className = "quiet";
    a.innerHTML = `<span class="name"></span><span class="root"></span><span class="mini">${b.counts.active} active · ${open} in motion · synced ${ts ? ago(ts) + " ago" : "never"}</span>`;
  } else {
    a.className = "board";
    a.innerHTML = `<div class="row1"><span class="name"></span><span class="badges">
        ${b.counts.blocked ? `<span class="pill blk">${b.counts.blocked} blocked</span>` : ""}
        ${b.unread ? `<span class="pill unread">${b.unread} unread</span>` : ""}
        ${b.verify?.needsHuman ? `<span class="pill needs">${b.verify.needsHuman} needs you</span>` : ""}
        ${b.live?.length ? `<span class="pill livep" title="${b.live.map((p) => p.alias + (p.subagents ? ` (+${p.subagents} sub-agents)` : "")).join(", ")}"><i></i>${
          b.live.length === 1 ? b.live[0].alias : `${b.live.length} live`
        }${b.live.reduce((n, p) => n + p.subagents, 0) ? ` +${b.live.reduce((n, p) => n + p.subagents, 0)}` : ""}</span>` : ""}
        ${b.reviewMe ? `<span class="pill">${b.reviewMe} for your review</span>` : ""}
      </span></div>
      <div class="root"></div>
      ${b.stack?.length || b.branch ? `<div class="facts">${[...(b.stack ?? []), b.branch].filter(Boolean).join(" · ")}</div>` : ""}
      <div class="counts"><span><b>${b.counts.active}</b> active</span>${sep}<span><b>${open}</b> in motion${b.counts.blocked ? `, ${b.counts.blocked} of them blocked` : ""}</span>${sep}<span>${b.counts.done} done${b.counts.stale ? ` · ${b.counts.stale} stale` : ""}</span>${b.verify?.graded ? `${sep}<span class="ver">${b.verify.graded} verified</span>` : ""}${sep}<span${stale ? ' class="stale"' : ""}>synced ${ts ? ago(ts) + " ago" : "never"}${stale ? " — stale mirror" : ""}</span></div>`;
  }
  a.querySelector(".name").textContent = b.name;
  const rootEl = a.querySelector(".root");
  rootEl.title = b.root; rootEl.textContent = b.root;
  return a;
}

// Boards stays the default view; Notes answers "what have I asked for" across
// every project without opening each board.
let view = "boards", tagFilter = null;
const FILTERS = [["!now", "act"], ["/skill", "skills"], [">lane", "moves"], ["#review-me", "review"], ["@me", "me"]];

function noteRow(r) {
  const a = document.createElement("a");
  a.className = "note";
  a.href = `/b/${r.slug}?card=${r.cardId}&note=${r.noteId}`;
  const b = document.createElement("div");
  b.className = "nb"; b.textContent = r.body;
  const f = document.createElement("div");
  f.className = "nf";
  const card = document.createElement("span");
  card.className = "card"; card.textContent = r.card ?? "(card gone)";
  f.append(card, sep(), text(`${r.lane ?? "?"}`), sep(), text(`${ago(Date.parse(r.updatedAt))} ago`));
  if (!r.pickedUp && !r.tags.me) { f.append(sep()); const w = text("awaiting pickup"); w.className = "wait"; f.append(w); }
  a.append(b, f);
  return a;
}
const text = (t) => { const s = document.createElement("span"); s.textContent = t; return s; };
const sep = () => { const s = document.createElement("span"); s.className = "dotsep"; return s; };

// "What have I asked for, everywhere" is one question, so one view answers it:
// the owner's own items alongside their card notes. Notes keep every behaviour
// they had; items are the new half.
let composeDraft = "";

function composeEl(boards) {
  const box = document.createElement("div");
  box.className = "compose";
  const ta = document.createElement("textarea");
  ta.placeholder = "Write anything. The agent sorts it into a task, a sub-task, a clarification, or a remark.";
  ta.setAttribute("aria-label", "write an ask");
  ta.value = composeDraft;
  const row = document.createElement("div");
  row.className = "crow";
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "board, optional");
  sel.innerHTML = `<option value="">no board yet</option>` +
    boards.map((b) => `<option value="${b.slug}"></option>`).join("");
  [...sel.options].slice(1).forEach((o, i) => { o.textContent = boards[i].name; });
  const hint = document.createElement("span");
  hint.className = "chint"; hint.textContent = "⌘↵ to add";
  const go = document.createElement("button");
  go.type = "button"; go.className = "go"; go.textContent = "Add";
  const submit = async () => {
    const v = ta.value.trim();
    if (!v) return;
    const res = await fetch("/api/item", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ body: v, ...(sel.value ? { slug: sel.value } : {}) }) });
    if (!res.ok) { hint.textContent = `could not add: ${(await res.json()).error}`; return; }
    ta.value = ""; composeDraft = ""; localStorage.removeItem("kanban-hubdraft");
    loadAsks();
  };
  go.onclick = submit;
  ta.addEventListener("input", () => { composeDraft = ta.value; localStorage.setItem("kanban-hubdraft", ta.value); });
  ta.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); submit(); } });
  row.append(sel, hint, go);
  box.append(ta, row);
  return box;
}

const postItem = async (patch) => {
  const res = await fetch("/api/item", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(patch) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `HTTP ${res.status}`);
};

// Ruling D2: an ask is captured without a destination and routed later. This is
// the "later", and the hub is where it belongs, because an unassigned ask shows
// on every rail and so has no single board page to be found on.
//
// Routing writes `boards`, never `slug`: slug records where the owner WROTE the
// ask and boards records where it SHOWS, which is the 2026-08-17 ruling that
// visibility is a display rule layered on the data.
function routeEl(it, boards, onDone) {
  const wrap = document.createElement("label");
  wrap.className = "route";
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "which board's rail this ask shows on");
  const tagged = it.boards ?? [];
  const origin = it.slug ? (boards.find((b) => b.slug === it.slug) ?? { slug: it.slug, name: it.slug }) : null;
  // Clearing the tags falls back to the origin board, so for an ask that has one
  // the blank option means "back where you wrote it" and NOT "everywhere". There
  // is no spelling for everywhere-despite-an-origin, so none is offered: an
  // option that silently did something else would be worse than its absence.
  sel.title = origin
    ? `Untagged, this ask shows on ${origin.name}, the board you wrote it on. Tag it to move it.`
    : "Untagged, this ask shows on every board's rail. Tag it to scope it to one.";
  const opts = [["", origin ? `on ${origin.name} · as written` : "on every board"]];
  for (const b of boards) { if (b.slug !== origin?.slug) opts.push([b.slug, `only on ${b.name}`]); }
  // A single select cannot express a multi-board tag. Naming the state keeps the
  // row honest, and picking anything else is then a deliberate narrowing.
  if (tagged.length > 1) opts.unshift(["__multi", `on ${tagged.length} boards`]);
  for (const [value, label] of opts) {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    if (value === "__multi") o.disabled = true;
    sel.append(o);
  }
  sel.value = tagged.length > 1 ? "__multi"
    : (tagged.length === 1 && tagged[0] !== origin?.slug) ? tagged[0]
    : "";
  sel.onchange = async () => {
    const v = sel.value;
    if (v === "__multi") return;
    wrap.className = "route busy"; sel.disabled = true;
    try {
      await postItem({ id: it.id, boards: v ? [v] : null });
      onDone();
    } catch (e) {
      wrap.className = "route"; sel.disabled = false;
      const err = document.createElement("span");
      err.className = "rerr"; err.textContent = `could not route: ${e.message}`;
      wrap.replaceChildren(sel, err);
    }
  };
  wrap.append(sel);
  return wrap;
}

function askRow(it, boards = [], onDone = () => {}) {
  const el = document.createElement("div");
  el.className = "ask" + (it.landing ? " landed" : "") + (it.starred ? " starred" : "");
  const b = document.createElement("div");
  b.className = "ab"; b.textContent = it.body;
  const f = document.createElement("div");
  f.className = "af";
  if (it.landing) {
    const s = document.createElement("span");
    s.className = "shape"; s.textContent = it.landing.shape;
    f.append(s);
    if (it.landedCard && it.slug) {
      const a = document.createElement("a");
      a.href = `/b/${it.slug}?card=${it.landing.cardId}`;
      a.textContent = it.landedCard;
      f.append(a);
    } else if (it.landedCard) { f.append(text(it.landedCard)); }
  }
  f.append(text(it.boardName ?? "no board yet"), sep(), text(`${ago(Date.parse(it.createdAt))} ago`));
  if (it.starred && !it.landing) { f.append(sep()); const s = text("starred"); s.className = "wait"; f.append(s); }
  if (!it.landing) { f.append(sep()); const w = text("not sorted yet"); w.className = "wait"; f.append(w); }
  // A sorted ask has already reached a card, so where it shows stops being a
  // decision. Same reason a star stops shouting once the item lands.
  if (!it.landing && boards.length) f.append(routeEl(it, boards, onDone));
  el.append(b, f);
  return el;
}

async function loadAsks() {
  const list = document.getElementById("list");
  list.replaceChildren(...Array.from({ length: 3 }, () => {
    const d = document.createElement("div"); d.className = "bone"; return d;   // genuinely unknown until fetched
  }));
  const [{ notes }, itemRes, boardRes] = await Promise.all([
    (await fetch("/api/notes")).json(),
    (await fetch("/api/items")).json(),
    (await fetch("/api/boards")).json(),
  ]);
  const items = (itemRes.items ?? []).filter((i) => !i.archived);
  const shown = tagFilter ? notes.filter((r) => r.tags[tagFilter]?.length || r.tags[tagFilter] === true) : notes;
  const bar = document.createElement("div");
  bar.className = "filters";
  FILTERS.forEach(([label, key]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.className = tagFilter === key ? "on" : "";
    // filters scope the note half only, so the items stay visible under one
    b.title = `filter notes by ${label}`;
    b.onclick = () => { tagFilter = tagFilter === key ? null : key; loadAsks(); };
    bar.appendChild(b);
  });

  const groups = [];
  const pending = items.filter((i) => !i.landing);
  const sorted = items.filter((i) => i.landing);
  const group = (label, rows, build) => {
    if (!rows.length) return;
    const g = document.createElement("div");
    g.className = "group";
    const l = document.createElement("div");
    l.className = "glabel"; l.textContent = `${label} · ${rows.length}`;
    g.appendChild(l);
    rows.forEach((r) => g.appendChild(build(r)));
    groups.push(g);
  };
  const boardList = boardRes.boards ?? [];
  group("Waiting to be sorted", pending, (r) => askRow(r, boardList, loadAsks));
  group("Sorted", sorted, askRow);

  const byBoard = new Map();
  for (const r of shown) { if (!byBoard.has(r.board)) byBoard.set(r.board, []); byBoard.get(r.board).push(r); }
  for (const [board, rows] of byBoard) group(`${board} · notes`, rows, noteRow);

  // The filter scopes notes only, so its empty state has to key on the NOTE
  // half. Keying on the whole view means any ask on file silences it and the
  // filter reads as a broken button.
  const tail = [];
  if (tagFilter && !shown.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = `No note carries ${FILTERS.find((f) => f[1] === tagFilter)[0]}.`;
    tail.push(e);
  } else if (!groups.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing yet. Write anything above and the agent will sort it.";
    tail.push(e);
  }
  list.replaceChildren(composeEl(boardRes.boards ?? []), bar, ...groups, ...tail);
}

// each view names itself in the title AND says what it is for, because the hub
// is where someone lands who does not yet know what any of this is
const VIEW_COPY = {
  boards: ["Your boards", "every project an agent is working on for you"],
  notes: ["Your asks", "things you wrote down for an agent to sort into cards"],
};
const HUB_ICON = {
  vBoards: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1.8" y="2.6" width="5" height="10.8" rx="1.4" stroke="currentColor" stroke-width="1.2"/><rect x="9.2" y="2.6" width="5" height="6.6" rx="1.4" stroke="currentColor" stroke-width="1.2"/></svg>`,
  vNotes: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.4 2.6h9.2v8.2L9.4 13.4H3.4V2.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12.6 10.8H9.4v2.6" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
  drafts: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M10.6 2.8 13.2 5.4 5.6 13H3v-2.6l7.6-7.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
};
document.querySelector("#hmark").innerHTML =
  `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.6" y="2.4" width="4.6" height="11.2" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="7.6" y="2.4" width="4.6" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M14.4 5v6.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
document.querySelector("#vBoards .vi").innerHTML = HUB_ICON.vBoards;
document.querySelector("#vNotes .vi").innerHTML = HUB_ICON.vNotes;
document.querySelector('.views a .vi').innerHTML = HUB_ICON.drafts;

function setView(v) {
  view = v;
  document.getElementById("vBoards").classList.toggle("on", v === "boards");
  document.getElementById("vNotes").classList.toggle("on", v === "notes");
  const [t, sub] = VIEW_COPY[v] ?? VIEW_COPY.boards;
  document.getElementById("htitle").textContent = t;
  document.getElementById("hsub").textContent = sub;
  load();
}
document.getElementById("vBoards").onclick = () => setView("boards");
document.getElementById("vNotes").onclick = () => setView("notes");
// the board is keyboard-first; its entrance should not be the odd one out
document.addEventListener("keydown", (e) => {
  // optional call: a keydown whose target is the document has no .matches,
  // and the throw took the whole handler down with it
  if (e.target.matches?.("input,textarea")) return;
  if (e.key === "1") setView("boards");
  if (e.key === "2") setView("notes");
  if (e.key === "3") location.href = "/drafts";
});

async function load() {
  const list = document.getElementById("list");
  if (view === "notes") { try { await loadAsks(); } catch (e) { list.innerHTML = `<div class="empty">Asks failed to load: ${e.message}</div>`; } return; }
  try {
    const { boards } = await (await fetch("/api/boards")).json();
    document.getElementById("huberr")?.remove(); // recovered: clear the failure note
    if (!boards.length) { list.innerHTML = `<div class="empty">No boards yet — run <code>kanban.sh init</code> in a project</div>`; return; }
    // a board that asks something of you is a card; the rest are rows
    const wants = (b) => b.counts.blocked > 0 || (b.unread || 0) > 0 || (b.reviewMe || 0) > 0;
    const bySync = (a, b) => Date.parse(b.syncedAt || 0) - Date.parse(a.syncedAt || 0);
    const hot = boards.filter(wants).sort((a, b) => (b.counts.blocked > 0) - (a.counts.blocked > 0) || bySync(a, b));
    const cold = boards.filter((b) => !wants(b)).sort(bySync);
    const groups = [];
    if (hot.length) groups.push(["Wants you", hot, false]);
    if (cold.length) groups.push(["Quiet", cold, true]);
    list.replaceChildren(...groups.map(([label, arr, quiet]) => {
      const g = document.createElement("div");
      g.className = "group";
      const l = document.createElement("div");
      l.className = "glabel"; l.textContent = label;
      g.appendChild(l);
      arr.forEach((b) => g.appendChild(boardEl(b, quiet)));
      return g;
    }));
    list.querySelectorAll(".root").forEach(tailTrim);
  } catch (e) {
    // one failed poll must not delete the fleet view: keep the last known rows
    if (list.querySelector("a")) {
      if (!document.getElementById("huberr")) list.insertAdjacentHTML("afterbegin", `<div id="huberr"></div>`);
      document.getElementById("huberr").textContent = `Hub poll failed: ${e.message} — showing last known state`;
    } else {
      list.innerHTML = `<div class="empty">Hub failed to load: ${e.message} — is the server up? kanban.sh check</div>`;
    }
  }
}
composeDraft = localStorage.getItem("kanban-hubdraft") ?? "";
load();
// the Asks view rebuilds its composer on every render, so a poll landing
// mid-sentence would take the field out from under the typing
setInterval(() => {
  const ta = document.querySelector(".compose textarea");
  if (ta && (document.activeElement === ta || ta.value.trim())) return;
  // Same reason, different control: a rebuild while a routing select is focused
  // or open drops the dropdown out from under the owner mid-decision.
  if (document.activeElement?.closest?.(".route")) return;
  load();
}, 10000);
</script>
