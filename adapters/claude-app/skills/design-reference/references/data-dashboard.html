<!DOCTYPE html>
<!--
  data-dashboard.html: a self-contained data dashboard template.

  Pattern: summary cards, a live text filter, and click-to-expand rows. Each row
  drills into sub-entity cards, each with a detail table. One file, no external
  dependencies, a dark and light toggle that follows the OS until the viewer
  picks. Fits any entity -> sub-entity -> detail-row dataset.

  To reuse:
    1. Replace the JSON in the #data script. When a generator fills it, inject
       at a sentinel by plain string replacement so CSS and JS braces survive.
    2. Adapt cards() (summary tiles), row() (the summary line and body) and
       item() (sub-entity card and detail table) to your shape.
    3. Match the summary grid columns (summary grid-template-columns) to row().
    4. Token names match colors.css, so that file can replace the inline block.
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Dashboard</title>
<style>
  :root{--bg:#121417;--surface:#1a1d22;--surface-2:#22262d;--text:#e6e9ef;--dim:#8b93a3;--border:#2c313a;--brand:#6aa3ff;--ok-line:#58c98f;--text-3:#5f6676;color-scheme:dark}
  :root[data-theme="light"]{--bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--text:#1a1d23;--dim:#5f6673;--border:#e1e4ea;--brand:#2563eb;--ok-line:#17834f;--text-3:#8a919d;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:18px;margin:0;font-weight:600}
  .src{color:var(--dim);font-size:12px}
  .toggle{margin-left:auto;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  .cards{display:flex;gap:8px;flex-wrap:wrap;padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:120px}
  .card .n{font-size:24px;font-weight:700}
  .card .l{color:var(--dim);font-size:12px}
  .wrap{padding:0 16px 40px}
  .search{width:100%;max-width:420px;margin:4px 0 12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
  details{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
  summary{display:grid;grid-template-columns:2fr 1.4fr auto auto;gap:12px;align-items:center;padding:8px 16px;min-height:40px;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:var(--surface-2)}
  summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .name{font-weight:600;overflow-wrap:anywhere}
  .sub{color:var(--dim);overflow-wrap:anywhere}
  .pill{justify-self:end;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
  .pill.ok{color:var(--ok-line);border-color:var(--ok-line)}
  .pill.zero{color:var(--text-3)}
  .body{padding:4px 16px 16px;border-top:1px solid var(--border)}
  .meta{color:var(--dim);font-size:13px;margin:8px 0}
  .meta b{color:var(--text);font-weight:600}
  .item{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin:8px 0;overflow-x:auto}
  .item h4{margin:0 0 4px;font-size:13px}
  .item .id{color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:500}
  td.na{color:var(--text-3)}
  .empty{color:var(--text-3);font-style:italic;padding:8px 0}
  @media (max-width:640px){summary{grid-template-columns:1fr auto auto}summary .sub{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<header>
  <h1>Data Dashboard</h1>
  <span class="src">sample data: replace the JSON in the data script</span>
  <button class="toggle" id="theme-toggle" aria-label="Toggle light and dark mode">☀ / ☾</button>
</header>
<div class="cards" id="cards"></div>
<div class="wrap">
  <input class="search" id="q" placeholder="Filter by name, owner or package" aria-label="Filter rows">
  <div id="list"></div>
</div>
<script id="data" type="application/json">[
  {"name":"billing-api","owner":"Payments","lang":"TypeScript","description":"Charges, refunds and invoices.","tags":"api; core",
   "items":[{"id":"pkg-001","name":"http stack","rows":[
     {"dep":"express","version":"4.19.2","latest":"4.21.0","license":"MIT"},
     {"dep":"zod","version":"3.23.8","latest":"3.23.8","license":"MIT"}]}]},
  {"name":"docs-site","owner":"Platform","lang":"Markdown","description":"Public documentation.","tags":"static","items":[]}
]</script>
<script>
const ROWS = JSON.parse(document.getElementById('data').textContent);
const count = r => (r.items || []).reduce((a, i) => a + (i.rows || []).length, 0);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cards(){
  const withItems = ROWS.filter(r => (r.items||[]).length).length;
  const c = [['repositories', ROWS.length], ['owners', new Set(ROWS.map(r=>r.owner)).size],
             ['packages', ROWS.reduce((a,r)=>a+(r.items||[]).length,0)], ['dependencies', ROWS.reduce((a,r)=>a+count(r),0)],
             ['with packages', withItems + ' of ' + ROWS.length]];
  document.getElementById('cards').innerHTML = c.map(([l,n]) => `<div class="card"><div class="n mono">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('');
}
function detailRow(d){
  const cell = v => { v = (v==null||v==='') ? 'none' : v; return `<td class="mono${v==='none'?' na':''}">${esc(v)}</td>`; };
  return `<tr>${cell(d.dep)}${cell(d.version)}${cell(d.latest)}${cell(d.license)}</tr>`;
}
function item(i){
  const rows = i.rows || [];
  const tbl = rows.length ? `<table><thead><tr><th>Dependency</th><th>Version</th><th>Latest</th><th>License</th></tr></thead><tbody>${rows.map(detailRow).join('')}</tbody></table>` : `<div class="empty">no detail rows</div>`;
  return `<div class="item"><h4><span class="id mono">${esc(i.id)}</span> ${esc(i.name)}</h4>${tbl}</div>`;
}
function row(r){
  const ic = (r.items||[]).length, dc = count(r);
  const detail = ic ? r.items.map(item).join('') : `<div class="empty">no packages</div>`;
  return `<details><summary>
      <span class="name">${esc(r.name)}</span>
      <span class="sub">${esc(r.owner)} · ${esc(r.lang)}</span>
      <span class="pill mono ${ic?'':'zero'}">${ic} pkg</span>
      <span class="pill mono ${dc?'ok':'zero'}">${dc} dep</span>
    </summary>
    <div class="body">
      <div class="meta"><b>Description:</b> ${esc(r.description)||'none'}</div>
      <div class="meta"><b>Tags:</b> ${esc(r.tags)||'none'}</div>
      ${detail}
    </div></details>`;
}
function render(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const show = ROWS.filter(r => !q || [r.name, r.owner, r.lang, ...(r.items||[]).flatMap(i => [i.id, i.name, ...(i.rows||[]).map(d=>d.dep)])].join(' ').toLowerCase().includes(q));
  document.getElementById('list').innerHTML = show.length ? show.map(row).join('') : '<div class="empty">no matches</div>';
}
(function(){
  const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
  const stored = () => { try { return localStorage.getItem('theme'); } catch (e) { return null; } };
  const apply = () => { root.dataset.theme = stored() || (mq.matches ? 'light' : 'dark'); };
  apply(); mq.addEventListener('change', apply);
  document.getElementById('theme-toggle').onclick = () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    root.dataset.theme = next;
  };
  document.getElementById('q').addEventListener('input', render);
  cards(); render();
})();
</script>
</body>
</html>
